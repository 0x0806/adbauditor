# Hardened static hosting for ADB Auditor (enhanced by 0x0806)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "usb=(self), camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
}
